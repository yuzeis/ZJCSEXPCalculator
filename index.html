<!DOCTYPE html>
<html lang="zh">
<head>
  <meta name="allow-embed" content="true">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>经验时间计算器</title>
  <link rel="stylesheet" href="static/css/style.css">
  <script src="static/js/app.js" defer></script>
</head>
<body>
  <main class="card">
    <h2>经验时间计算器</h2>
    <small class="version-note">版本 2.0.3 – 羽之国20250923</small>
    <small class="version-note">BY 小云雀来海</small>
    <div id="externalCountdown" class="version-note">倒计时加载中...</div>

    <form id="expForm" autocomplete="off" novalidate>
      <div class="form-group">
        <label for="csvVersion">经验表版本</label>
        <select id="csvVersion">
		  <option value="Saint" selected>S3羽之国版本 Ver3.1.2</option>
          <option value="Gold" >S2龙之国版本 Ver2.1.1</option>
          <option value="Silver">S1泽之国版本 Ver1.1.2</option>
        </select>
      </div>

      <div class="form-group">
        <label for="currentLevel">现在等级（现Lv）</label>
        <input id="currentLevel" type="number" min="1" placeholder="如 98">
      </div>

      <div class="form-group">
        <label for="currentExp">现有经验（现Exp）</label>
        <input id="currentExp" type="number" min="0" placeholder="如 5000">
      </div>

      <div class="form-group">
        <label for="targetLevel">目标等级（目标Lv）</label>
        <input id="targetLevel" type="number" min="1" placeholder="如 100">
      </div>

      <div class="form-group">
        <label for="expPerHour">每小时经验（EXP/h）</label>
        <input id="expPerHour" type="number" min="1" placeholder="如 20000">
      </div>

      <div class="form-group boost-row">
        <div class="boost-col">
          <label for="dailyBoosts">日常加速次数</label>
          <input id="dailyBoosts" type="number" min="0" value="0">
        </div>
        <div class="boost-col">
          <label for="stoneBoosts">加速石头次数</label>
          <input id="stoneBoosts" type="number" min="0" value="0">
        </div>
      </div>

      <div class="form-group auto-calc-row">
        <label class="checkbox-label">
          <input id="autoCalcDaily" type="checkbox">
          <span>自动计算日常加速（每24小时1次）</span>
        </label>
      </div>

      <button id="calcBtn" type="submit" disabled>开始计算</button>
      <button id="editBtn" type="button" disabled>编辑经验表</button>
    </form>

    <section id="results" class="results" hidden aria-live="polite" aria-atomic="true">
      <p id="remainingExp"></p>
      <p id="neededSeconds"></p>
      <p id="nowTime"></p>
      <p id="finishTime"></p>
      <p id="acceleratedTime"></p>
      <p id="countdown"></p>
      <p id="acceleratedCountdown"></p>
    </section>
  </main>

  <footer id="visitCounterFixed">
    页面访问次数：<span id="counter">加载中...</span>｜
    今日访问：<span id="todayCounter">加载中...</span>｜
    <a href="https://github.com/yuzeis/ZJCSEXPCalculator" target="_blank" rel="noopener noreferrer">源代码</a>｜
    <details id="historyDetails"><summary>历史版本</summary><pre id="historyContent">加载中...</pre></details>
  </footer>

  <!-- 编辑器遮罩层：通过 hidden 属性控制显示/隐藏，无内联样式 -->
  <div class="overlay" id="overlay" hidden>
    <div class="editor" role="dialog" aria-modal="true">
      <h3>编辑等级经验表</h3>
      <img src="static/img/1.jpg" alt="等级经验对照示例">
      <table id="csvTable"></table>
      <div class="editor-actions">
        <button id="addRowBtn" type="button" hidden>添加行</button>
        <button id="saveCsvBtn" type="button" hidden>保存</button>
        <button id="cancelBtn" type="button" class="secondary">取消</button>
      </div>
    </div>
  </div>
</body>
</html>
